[package]
name = "winds"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "winds"
path = "src/main.rs"

[lib]
name = "winds"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.93"
async-process = "2.3.0"
async-recursion = "1.1.1"
cached = "0.54.0"
confy = { version = "0.5.1", default-features = false, features = ["yaml_conf"] }
chrono = { version = "0.4.38", features = ["serde"] }
flate2 = "1.0"
num = "0.4.3"
http = "1.1.0"
image = "0.25.5"
log = "0.4.22"
env_logger = "0.11.5"
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "gzip"] }
rocket = { version = "0.5.1", features = ["json"] }
rocket_cors = "0.6.0"
rust-s3 = { version = "0.35.1", default-features = false, features = ["tokio", "blocking", "tokio-rustls-tls"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
structopt = "0.3.26"
tempfile = "3.14.0"
thiserror = "2.0.1"
tokio = "1.41.1"
serde_derive = "1.0.214"
